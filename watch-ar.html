<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ساعت مچی AR</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
#watch {
  position: absolute;
  width: 120px;
  height: 150px;
  background: url('https://systino.com/uploads/5ea841cf7557411ba37fee4051840561.png') center/contain no-repeat;
  display: none;
}
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-family: sans-serif;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <div id="watch"></div>
    <div id="status">در حال بارگذاری...</div>
  </div>

  <script type="module">
    import { HandLandmarker, FilesetResolver } from './hands.js';

    const statusText = document.getElementById('status');
    const video = document.getElementById('video');
    const watch = document.getElementById('watch');

    let handLandmarker;

    async function initCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'environment',
          width: 640,
          height: 480
        },
        audio: false
      });
      video.srcObject = stream;
      return new Promise(resolve => {
        video.onloadedmetadata = () => {
          resolve();
        };
      });
    }

    async function initMediaPipe() {
      const fileset = await FilesetResolver.forVisionTasks(
        './' // مسیر نسبی به فایل‌های wasm و مدل‌ها
      );

      handLandmarker = await HandLandmarker.createFromOptions(fileset, {
        baseOptions: {
          modelAssetPath: './hand_landmark_lite.tflite',
          delegate: 'GPU'
        },
        runningMode: 'VIDEO',
        numHands: 1
      });
    }

    async function main() {
      await initCamera();
      await initMediaPipe();

      statusText.textContent = 'در حال شناسایی دست...';
      video.play();

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      function detectHands() {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const results = handLandmarker.detectForVideo(canvas, performance.now());

        if (results.landmarks.length > 0) {
          const wrist = results.landmarks[0][0]; // نقطه مچ دست
          const x = wrist.x * window.innerWidth;
          const y = wrist.y * window.innerHeight;

          watch.style.left = `${x - 40}px`;
          watch.style.top = `${y - 40}px`;
          watch.style.display = 'block';

          statusText.textContent = 'دست شناسایی شد';
        } else {
          watch.style.display = 'none';
          statusText.textContent = 'در حال شناسایی دست...';
        }

        requestAnimationFrame(detectHands);
      }

      requestAnimationFrame(detectHands);
    }

    main();
  </script>
</body>
</html>
