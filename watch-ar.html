<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ساعت مچی AR</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #watch {
      position: absolute;
      width: 100px;
      height: auto;
      display: none;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 8px;
      border-radius: 5px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <img id="watch" src="https://raw.githubusercontent.com/r2e1m0o4/re-midapipe/main/watch.png" alt="Watch">
    <div id="status">در حال بارگذاری مدل...</div>
  </div>

  <script type="module">
    import { FilesetResolver, HandLandmarker } from './hands.js';

    const video = document.getElementById('video');
    const watch = document.getElementById('watch');
    const statusText = document.getElementById('status');

    let handLandmarker;
    let lastVideoTime = -1;

    async function init() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream;

      await new Promise(resolve => video.onloadedmetadata = resolve);

      const fileset = await FilesetResolver.forVisionTasks('./');
      handLandmarker = await HandLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: './hand_landmark_full.tflite' },
        runningMode: 'VIDEO',
        numHands: 1
      });

      statusText.textContent = 'در حال شناسایی دست...';
      requestAnimationFrame(detect);
    }

    async function detect() {
      if (!video.paused && !video.ended && video.readyState === 4) {
        const now = performance.now();
        if (video.currentTime !== lastVideoTime) {
          lastVideoTime = video.currentTime;
          const result = handLandmarker.detectForVideo(video, now);

          if (result.handednesses.length > 0) {
            const wrist = result.landmarks[0][0];
            const x = wrist.x * video.offsetWidth;
            const y = wrist.y * video.offsetHeight;

            watch.style.left = `${x}px`;
            watch.style.top = `${y}px`;
            watch.style.display = 'block';
            statusText.textContent = 'دست پیدا شد!';
          } else {
            watch.style.display = 'none';
            statusText.textContent = 'در حال شناسایی دست...';
          }
        }
      }
      requestAnimationFrame(detect);
    }

    init();
  </script>
</body>
</html>
