<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ساعت AR روی مچ دست</title>
  <style>
    body {
      margin: 0;
      background: #000;
      text-align: center;
      overflow: hidden;
    }
    #video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #watch {
      position: absolute;
      width: 150px;
      height: 180px;
      background-size: contain;
      background-repeat: no-repeat;
      pointer-events: none;
      display: none;
      z-index: 10;
    }
    #status {
      position: absolute;
      top: 10px;
      width: 100%;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 8px;
      font-family: sans-serif;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="status">در حال راه‌اندازی...</div>
  <video id="video" autoplay playsinline muted></video>
  <div id="watch"></div>

  <!-- فایل‌های MediaPipe از GitHub شما -->
  <script src="https://r2e1m0o4.github.io/re-midapipe/hands.js"></script>
  <script src="https://r2e1m0o4.github.io/re-midapipe/hands_solution_simd_wasm_bin.js"></script>
  <script>
    const video = document.getElementById('video');
    const watch = document.getElementById('watch');
    const statusText = document.getElementById('status');
    const watchImage = 'https://systino.com/uploads/5ea841cf7557411ba37fee4051840561.png';

    watch.style.backgroundImage = `url(${watchImage})`;

    async function setupCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "user" } }
        });
        video.srcObject = stream;
        await video.play();
        return true;
      } catch (err) {
        console.error("Camera error:", err);
        statusText.textContent = "خطا در دسترسی به دوربین";
        return false;
      }
    }

    async function startHandTracking() {
      const hands = new Hands({
        locateFile: (file) => `https://r2e1m0o4.github.io/re-midapipe/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      hands.onResults((results) => {
        if (
          results.multiHandLandmarks &&
          results.multiHandLandmarks.length > 0
        ) {
          const wrist = results.multiHandLandmarks[0][0]; // نقطه مچ
          const x = (1 - wrist.x) * video.videoWidth;
          const y = wrist.y * video.videoHeight;
          watch.style.left = `${x - 75}px`;
          watch.style.top = `${y - 90}px`;
          watch.style.display = "block";
        } else {
          watch.style.display = "none";
        }
      });

      async function detectLoop() {
        await hands.send({ image: video });
        requestAnimationFrame(detectLoop);
      }

      detectLoop();
    }

    async function init() {
      statusText.textContent = "در حال فعال‌سازی دوربین...";
      const ok = await setupCamera();
      if (!ok) return;

      statusText.textContent = "در حال بارگذاری مدل...";
      await startHandTracking();
      statusText.textContent = "دستت رو جلوی دوربین بگیر!";
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
