<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ساعت واقعیت افزوده</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror for selfie mode */
    }
    #watch {
      position: absolute;
      width: 100px;
      height: auto;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background-color: rgba(0,0,0,0.6);
      padding: 10px;
      border-radius: 5px;
      z-index: 10;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="status">در حال راه‌اندازی...</div>
    <video id="video" autoplay playsinline muted></video>
    <img id="watch" src="https://raw.githubusercontent.com/r2e1m0o4/re-midapipe/main/watch.png" alt="watch">
  </div>

  <!-- اسکریپت‌ها -->
  <script type="module">
    import { HandLandmarker, FilesetResolver } from "./hands.js";

    const video = document.getElementById("video");
    const watch = document.getElementById("watch");
    const statusText = document.getElementById("status");

    let handLandmarker;
    let running = false;

    async function setupCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" }, // دوربین پشت
          width: { ideal: 640 },
          height: { ideal: 480 }
        }
      });
      video.srcObject = stream;
      return new Promise(resolve => {
        video.onloadedmetadata = () => {
          video.play();
          resolve();
        };
      });
    }

    async function loadModel() {
      const fileset = await FilesetResolver.forVisionTasks("./");
      handLandmarker = await HandLandmarker.createFromOptions(fileset, {
        baseOptions: {
          modelAssetPath: "./hand_landmark_full.tflite",
          delegate: "CPU"
        },
        runningMode: "VIDEO",
        numHands: 1
      });
    }

    function updateWatchPosition(landmarks) {
      if (!landmarks || landmarks.length === 0) {
        watch.style.display = "none";
        return;
      }
      const wrist = landmarks[0][0]; // نقطه‌ی مچ دست
      const x = wrist.x * window.innerWidth;
      const y = wrist.y * window.innerHeight;
      watch.style.left = `${x}px`;
      watch.style.top = `${y}px`;
      watch.style.display = "block";
    }

    async function detect() {
      if (!running) return;

      const results = handLandmarker.detectForVideo(video, performance.now());
      updateWatchPosition(results.landmarks);
      requestAnimationFrame(detect);
    }

    async function init() {
      try {
        await setupCamera();
        statusText.innerText = "در حال بارگذاری مدل...";
        await loadModel();
        statusText.innerText = "مدل بارگذاری شد. در حال تشخیص دست...";
        running = true;
        detect();
      } catch (e) {
        console.error(e);
        statusText.innerText = "خطا در راه‌اندازی!";
      }
    }

    init();
  </script>
</body>
</html>
