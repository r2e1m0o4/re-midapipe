<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ساعت AR</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #video { width: 100%; height: 100vh; object-fit: cover; transform: scaleX(-1); }
    #watch {
      position: absolute;
      width: 150px;
      height: 180px;
      background: url('https://i.imgur.com/JqYeYnR.png') center/contain no-repeat;
      display: none;
      pointer-events: none;
    }
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      font-family: sans-serif;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="status">در حال راه‌اندازی...</div>
  <video id="video" autoplay playsinline muted></video>
  <div id="watch"></div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

  <script>
    const video = document.getElementById('video');
    const watch = document.getElementById('watch');
    const statusText = document.getElementById('status');

    async function setupCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });
        video.srcObject = stream;
        await new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play();
            resolve();
          };
        });
        return true;
      } catch (err) {
        statusText.textContent = "⚠️ دوربین فعال نشد!";
        console.error("Camera Error:", err);
        return false;
      }
    }

    async function main() {
      statusText.textContent = "🔵 در حال روشن کردن دوربین...";
      const cameraReady = await setupCamera();
      if (!cameraReady) return;

      statusText.textContent = "🔵 در حال بارگذاری مدل...";
      try {
        const hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
          if (results.multiHandLandmarks?.length > 0) {
            const wrist = results.multiHandLandmarks[0][0];
            const x = (wrist.x * video.videoWidth) - 75;
            const y = (wrist.y * video.videoHeight) - 90;
            
            watch.style.left = `${x}px`;
            watch.style.top = `${y}px`;
            watch.style.display = "block";
          } else {
            watch.style.display = "none";
          }
        });

        const camera = new Camera(video, {
          onFrame: async () => {
            await hands.send({ image: video });
          },
          width: 1280,
          height: 720
        });
        camera.start();
        
        statusText.textContent = "✅ آماده! دست خود را جلوی دوربین بگیرید";
      } catch (e) {
        statusText.textContent = "❌ خطا در بارگذاری مدل";
        console.error("Model Error:", e);
      }
    }

    main();
  </script>
</body>
</html>
