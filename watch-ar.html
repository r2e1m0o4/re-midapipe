<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ساعت مچی AR</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #watch {
      position: absolute;
      width: 120px;
      height: 150px;
      background: url('https://i.imgur.com/JqYeYnR.png') center/contain no-repeat;
      display: none;
    }
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      font-family: sans-serif;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="status">در حال راه‌اندازی...</div>
    <video id="video" autoplay playsinline muted></video>
    <div id="watch"></div>
  </div>

  <script>
    const video = document.getElementById('video');
    const watch = document.getElementById('watch');
    const statusText = document.getElementById('status');

    // مرحله ۱: راه‌اندازی دوربین
    async function setupCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        });
        video.srcObject = stream;
        
        // منتظر می‌مانیم تا ویدیو آماده شود
        await new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play();
            resolve();
          };
        });
        
        statusText.textContent = "دوربین فعال شد!";
        return true;
      } catch (err) {
        statusText.textContent = "خطا در دسترسی به دوربین";
        console.error("Camera Error:", err);
        return false;
      }
    }

    // مرحله ۲: شبیه‌سازی تشخیص دست (برای تست اولیه)
    function simulateHandTracking() {
      // مختصات تصادفی برای تست
      const x = Math.random() * window.innerWidth;
      const y = Math.random() * window.innerHeight;
      
      watch.style.left = `${x - 60}px`;
      watch.style.top = `${y - 75}px`;
      watch.style.display = "block";
      
      // هر 2 ثانیه موقعیت تغییر کند
      setTimeout(simulateHandTracking, 2000);
    }

    // مرحله ۳: شروع برنامه
    async function init() {
      statusText.textContent = "در حال راه‌اندازی دوربین...";
      
      // ابتدا تست ساده بدون MediaPipe
      if (await setupCamera()) {
        statusText.textContent = "حالت تست: ساعت در حال نمایش تصادفی است";
        simulateHandTracking();
        
        // بعداً می‌توانید MediaPipe را اضافه کنید
        // loadMediaPipe();
      }
    }

    // شروع برنامه
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
