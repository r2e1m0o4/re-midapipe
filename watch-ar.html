<script>
    const video = document.getElementById('video');
    const watch = document.getElementById('watch');
    const statusText = document.getElementById('status');
    const watchImage = 'https://systino.com/uploads/5ea841cf7557411ba37fee4051840561.png';

    watch.style.backgroundImage = `url(${watchImage})`;

    async function setupCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "user" } }
        });
        video.srcObject = stream;
        await video.play();
        return true;
      } catch (err) {
        console.error("Camera error:", err);
        statusText.textContent = "خطا در دسترسی به دوربین";
        return false;
      }
    }

    async function startHandTracking() {
      const hands = new Hands({
        locateFile: (file) => `https://r2e1m0o4.github.io/re-midapipe/${file}`
      });

      // تنظیمات ساده‌تر اما موثر
      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0,  // مدل ساده‌تر برای عملکرد بهتر
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      hands.onResults((results) => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          // نقطه مچ دست (نقطه 0 در landmarks)
          const wrist = results.multiHandLandmarks[0][0];
          
          // تبدیل مختصات نرمال شده به پیکسل
          // توجه: video.videoWidth و video.videoHeight ممکن است با اندازه نمایش متفاوت باشد
          const videoWidth = video.videoWidth;
          const videoHeight = video.videoHeight;
          
          // محاسبه موقعیت ساعت با در نظر گرفتن اندازه آن
          const watchWidth = 150;
          const watchHeight = 180;
          const x = wrist.x * videoWidth - watchWidth/2;
          const y = wrist.y * videoHeight - watchHeight/2;
          
          // تنظیم موقعیت ساعت
          watch.style.left = `${x}px`;
          watch.style.top = `${y}px`;
          watch.style.display = "block";
          
          // برای دیباگ: نمایش مختصات در کنسول
          console.log(`Wrist at: X=${x}, Y=${y}`);
        } else {
          watch.style.display = "none";
          console.log("No hand detected");
        }
      });

      async function detectLoop() {
        try {
          // فقط اگر ویدیو آماده است پردازش شود
          if (video.readyState >= video.HAVE_ENOUGH_DATA) {
            await hands.send({ image: video });
          }
        } catch (e) {
          console.error("Detection error:", e);
        }
        requestAnimationFrame(detectLoop);
      }

      detectLoop();
    }

    async function init() {
      statusText.textContent = "در حال فعال‌سازی دوربین...";
      const ok = await setupCamera();
      if (!ok) return;

      statusText.textContent = "در حال بارگذاری مدل...";
      try {
        await startHandTracking();
        statusText.textContent = "دستت رو جلوی دوربین بگیر!";
      } catch (e) {
        console.error("Tracking error:", e);
        statusText.textContent = "خطا در بارگذاری مدل تشخیص دست";
      }
    }

    window.addEventListener("DOMContentLoaded", init);
</script>
