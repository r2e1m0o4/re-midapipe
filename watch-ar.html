<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ساعت AR - شناسایی دست</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100vh;
      max-width: 800px;
      margin: 20px auto;
      border-radius: 10px;
      overflow: hidden;
      background-color: #000;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #watch {
      position: absolute;
      pointer-events: none;
      width: 150px;
      height: 180px;
      background-image: url('https://systino.com/uploads/5ea841cf7557411ba37fee4051840561.png');
      background-size: contain;
      background-repeat: no-repeat;
      display: none;
      z-index: 5;
    }
    #status {
      position: absolute;
      top: 10px;
      left: 0;
      right: 0;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="status">در حال راه‌اندازی...</div>
    <video id="video" autoplay playsinline muted></video>
    <div id="watch"></div>
  </div>

  <!-- استفاده از CDN برای MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

  <script>
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');
    const watchEl = document.getElementById('watch');
    
    // تصویر ساعت
    const watchImg = new Image();
    watchImg.src = 'https://systino.com/uploads/5ea841cf7557411ba37fee4051840561.png';

    // تنظیم اندازه ساعت
    function setupWatch() {
      watchEl.style.width = '150px';
      watchEl.style.height = '180px';
      watchEl.style.backgroundImage = `url(${watchImg.src})`;
    }

    // راه‌اندازی دوربین
    async function setupCamera() {
      try {
        statusEl.textContent = 'در حال اتصال به دوربین...';
        const constraints = {
          video: { facingMode: 'user' }
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;

        await new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play().then(resolve);
          };
        });

        return true;
      } catch (error) {
        console.error('Camera setup error:', error);
        statusEl.textContent = `خطا در دوربین: ${error.message}`;
        return false;
      }
    }

    // راه‌اندازی مدل تشخیص دست
    async function setupHands() {
      try {
        statusEl.textContent = 'در حال بارگذاری مدل تشخیص دست...';
        const hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        await hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 0,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });

        return hands;
      } catch (error) {
        console.error('Hands setup error:', error);
        statusEl.textContent = 'خطا در بارگذاری مدل تشخیص دست';
        throw error;
      }
    }

    // راه‌اندازی اصلی
    async function main() {
      // 1. تنظیم ساعت
      setupWatch();

      // 2. راه‌اندازی دوربین
      const cameraReady = await setupCamera();
      if (!cameraReady) return;

      // 3. راه‌اندازی مدل
      const hands = await setupHands();

      // 4. شروع پردازش
      statusEl.textContent = 'آماده به کار! دست خود را مقابل دوربین بگیرید';

      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: video.videoWidth,
        height: video.videoHeight
      });

      hands.onResults((results) => {
        if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
          watchEl.style.display = 'none';
          return;
        }

        const wrist = results.multiHandLandmarks[0][0];
        const x = (1 - wrist.x) * video.videoWidth;
        const y = wrist.y * video.videoHeight;

        watchEl.style.left = `${x - 75}px`;
        watchEl.style.top = `${y - 90}px`;
        watchEl.style.display = 'block';
      });

      await camera.start();
    }

    // شروع برنامه
    document.addEventListener('DOMContentLoaded', main);
  </script>
</body>
</html>
